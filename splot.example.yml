# Example splot configuration.
#
# Copy this file to `splot.yml` and replace the placeholder WireGuard keys,
# endpoints, and addresses with your own. `splot.yml` is git-ignored so your
# real keys never end up in the repo.
#
# Public keys are validated (44 characters of base64, ending in `=`), so the
# placeholders below (`Replace…PublicKeyAAAA…=`) are well-formed fakes: the file
# passes `splot check` as-is, but none of them is anyone's real key.
#
# splot acts on a node named with `--node <its name>`, reaching it over ssh at
# its `platform.ssh` (`--ssh` for another destination, `--local` on the node
# itself); before writing anything, splot checks that the node's WireGuard key
# is the one in its `publicKey`.
#
# Addresses below use the RFC 5737 / RFC 1918 documentation ranges.

# The whole WireGuard mesh address space: nodes and global clients take their
# `meshIp` from it, and each node may set aside a hub network inside it.
meshNetwork: 10.100.0.0/16

# Seconds between WireGuard keepalives, for the hosts that send them: a host
# nobody can dial that others connect to, like a node without an endpoint
# (Lake below), keeps its NAT mapping open with them. Optional, 25 by default;
# 0 turns none on.
keepaliveInterval: 25

# Global clients: roaming devices (phones, laptops) reachable across the
# whole mesh. Tags applied here are usable in any service's `allowFrom`.
clients:
  Phone:
    publicKey: ReplacePhonePublicKeyAAAAAAAAAAAAAAAAAAAAAA=
    meshIp: 10.100.0.100
    macs: aa:bb:cc:00:00:01
    tags: admin
    # Per-node addresses let the phone get a static lease on a router's LAN.
    ips:
      Home:
        lan: 192.168.1.50

nodes:
  # Internet-facing router. Hosts services and exposes some to the WAN
  # through the firewall zone named in `wanZone`, where splot also lets its
  # WireGuard listen port in: the other nodes dial it at its endpoint.
  Home:
    # The software the node runs. On OpenWrt, splot manages WireGuard
    # (netifd), the firewall (fw4) and DHCP (dnsmasq) unless told otherwise;
    # `firewall: none`, for one, leaves the firewall to you.
    platform:
      os: openwrt
      # Where splot reaches it over ssh: anything ssh takes, given to the
      # system ssh as it is (so ~/.ssh/config and your ssh agent apply). Here
      # its LAN address.
      ssh: root@192.168.1.1
    publicKey: ReplaceHomePublicKeyAAAAAAAAAAAAAAAAAAAAAAA=
    endpoint: 203.0.113.10
    listenPort: 51820
    meshIp: 10.100.0.1
    wanZone: wan

    services:
      # SSH to the router itself, reachable from anything tagged `admin`
      # (the phone) anywhere on the mesh.
      ssh:
        port: 22
        proto: tcp
        allowFrom: admin

    zones:
      lan:
        address: 192.168.1.1/24
        devices:
          printer:
            ip: 192.168.1.16
            macs: aa:bb:cc:00:00:02
            services:
              print:
                port: 9100
                proto: tcp
                allowFrom: admin

          nas:
            ip: 192.168.1.20
            macs: aa:bb:cc:00:00:03
            services:
              # Reachable from admin devices on the mesh AND published to the
              # public internet. "8443:443" forwards external 8443 to the
              # NAS's internal 443; `sources` restricts the WAN side to one
              # office CIDR (omit `sources` to expose it publicly).
              https:
                port: "8443:443"
                proto: tcp
                allowFrom: admin
                wan:
                  via: [Home]
                  sources: ["198.51.100.0/24"]

      # A network of its own (a VLAN on the router) for what shouldn't reach
      # the rest. splot drops whatever no service lets through between the
      # zones it knows, and between them and the mesh.
      iot:
        address: 192.168.10.1/24
        devices:
          tv:
            ip: 192.168.10.20
            macs: aa:bb:cc:00:00:05
            services:
              # Cast to it from anything on Home's lan; the tv itself reaches
              # nothing beyond its zone.
              cast:
                port: 8009
                proto: tcp
                allowFrom: Home.lan

    # Devices that reach the mesh through Home alone (e.g. behind an LTE
    # modem's NAT): peers on Home's mesh interface only. Every other node routes
    # the whole hub network through Home; `Home.$hub` refers to it.
    hub:
      network: 10.100.10.0/24
      clients:
        lte-cam:
          publicKey: ReplaceLteCamPublicKeyAAAAAAAAAAAAAAAAAAAAA=
          ip: 10.100.10.10
          # Every pair uses a preshared key unless one end turns it off; this
          # camera's built-in WireGuard client has no field for one.
          psk: false
          services:
            rtsp:
              port: 554
              proto: tcp
              allowFrom: admin

  # Remote site. No services exposed to the WAN — reachable over the mesh.
  # The other nodes dial it, so splot lets its listen port in from `wanZone`.
  Cabin:
    platform:
      os: openwrt
      # Over the mesh, at its meshIp: fine once it's in the mesh, but not for a
      # node that isn't yet, or whose tunnel is down.
      ssh: root@10.100.0.2
    publicKey: ReplaceCabinPublicKeyAAAAAAAAAAAAAAAAAAAAAA=
    # Its public IP changes, so peers dial it by name. The name must resolve
    # through public DNS, never through the mesh: the tunnel can't need itself
    # to come up. A peer name that doesn't resolve keeps the whole mesh
    # interface down, not just that peer (on OpenWrt and with wg-quick alike).
    endpoint: cabin.example.net
    listenPort: 51820
    meshIp: 10.100.0.2
    wanZone: wan

    services:
      # DNS on the router itself, for Home's resolver to forward Cabin's names
      # to. What Home sends itself comes from its meshIp, which `Home` (its
      # networks) doesn't cover: `Home.$node` is Home itself. On Home that
      # traffic leaves through its output, so only Cabin gets a rule.
      dns:
        port: 53
        proto: [udp, tcp]
        allowFrom: Home.$node

    zones:
      lan:
        address: 192.168.2.1/24
        devices:
          camera:
            ip: 192.168.2.30
            macs: aa:bb:cc:00:00:04
            services:
              # The camera's RTSP stream, viewable from admin devices
              # anywhere on the mesh — but never from the public internet.
              rtsp:
                port: 554
                proto: tcp
                allowFrom: admin

  # Behind its ISP's NAT with no port forward, so nobody can dial it: no
  # endpoint. It dials the others, and keeps its NAT mapping open with
  # keepalives so they can reach it too. A node without an endpoint can't
  # host a hub (hub clients dial their hub node), and two such nodes have no
  # tunnel between them.
  Lake:
    platform:
      os: openwrt
      # Its DHCP is kept by hand: splot writes no leases there and leaves its
      # DHCP config alone.
      dhcp: none
      # A host of your ~/.ssh/config (say, with a ProxyJump).
      ssh: lake
    publicKey: ReplaceLakePublicKeyAAAAAAAAAAAAAAAAAAAAAAA=
    listenPort: 51820
    meshIp: 10.100.0.3

    zones:
      lan:
        address: 192.168.3.1/24

  # A Linux host that runs the mesh at its site, a Raspberry Pi say. Linux
  # has no usual setup to assume, so its platform names the program behind
  # every concern (`none` where splot should leave one alone). On Linux splot
  # applies only the WireGuard so far: `splot apply` refuses Barn until its
  # firewall and DHCP are `none` too.
  Barn:
    platform:
      os: linux
      wireguard: wg-quick
      firewall: nftables
      dhcp: dnsmasq
      dns: dnsmasq
      ssh: root@192.168.4.1
    publicKey: ReplaceBarnPublicKeyAAAAAAAAAAAAAAAAAAAAAAA=
    endpoint: 203.0.113.30
    listenPort: 51820
    meshIp: 10.100.0.4
    wanZone: wan

    zones:
      lan:
        address: 192.168.4.1/24
